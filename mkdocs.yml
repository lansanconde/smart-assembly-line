site_name: Smart Assembly Line
site_description: >
  Système de supervision industrielle IoT temps réel sur AWS —
  Architecture event-driven, edge computing Greengrass, résilience chaos-tested,
  entièrement provisionné en Terraform. Niveau Staff Architect.
site_author: Lansana CONDÉ
site_url: https://lansanconde.github.io/smart-assembly-line/
docs_dir: docs
repo_name: lansanconde/smart-assembly-line
repo_url: https://github.com/lansanconde/smart-assembly-line
edit_uri: ""

copyright: >
  © 2026 Lansana CONDÉ · Smart Aerospace Assembly Line · AWS Staff Architect

# ─────────────────────────────────────────
# THEME — Material for MkDocs
# ─────────────────────────────────────────
theme:
  name: material
  language: fr

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair

  font:
    text: Inter
    code: JetBrains Mono

  features:
    # Navigation
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    # Recherche
    - search.highlight
    - search.share
    - search.suggest
    # Contenu
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.tabs.link
    # TOC
    - toc.follow

# ─────────────────────────────────────────
# CSS PERSONNALISÉ
# ─────────────────────────────────────────
extra_css:
  - stylesheets/extra.css

# ─────────────────────────────────────────
# EXTENSIONS MARKDOWN
# ─────────────────────────────────────────
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.critic
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - toc:
      permalink: true
      title: Sur cette page

# ─────────────────────────────────────────
# PLUGINS
# ─────────────────────────────────────────
plugins:
  - search:
      lang: fr
      separator: '[\s\-\.]+'

# ─────────────────────────────────────────
# EXTRA — Réseaux sociaux
# ─────────────────────────────────────────
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lansanconde/smart-assembly-line
      name: GitHub — smart-assembly-line
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/lansana-conde
      name: LinkedIn — Lansana CONDÉ
    - icon: fontawesome/solid/globe
      link: https://do1vmragia1j9.cloudfront.net
      name: Portfolio en ligne
  generator: false

# ─────────────────────────────────────────
# NAVIGATION — 6 onglets max pour Material tabs
# ─────────────────────────────────────────
