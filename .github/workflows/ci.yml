# =============================================================
# CI/CD — Smart Assembly Line
# GitHub Actions
#
# Stages :
#   1. terraform fmt + validate
#   2. checkov (security scan)
#   3. pytest (Lambda unit tests)
#   4. mvn test (Spring Boot supervision-api)
#   5. terraform plan  → commentaire PR (PR uniquement)
#   6. terraform apply → AWS (push sur main uniquement)
# =============================================================

name: CI/CD Smart Assembly Line

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'src/**'

# Évite deux terraform apply simultanés sur le même state
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}
  TF_VERSION:            "1.9.0"
  TF_WORKING_DIR:        "terraform/environments/dev"

# =============================================================
# Job 1 — Terraform Validate & Format
# =============================================================
jobs:
  terraform-validate:
    name: "Terraform Validate & Format"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
        # Correction locale : terraform fmt -recursive (avant de pusher)

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false
        # -backend=false : pas besoin du state pour validate

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

# =============================================================
# Job 2 — Security Scan (Checkov)
# =============================================================
  security-scan:
    name: "Security Scan — Checkov"
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov
        run: |
          checkov \
            -d terraform/ \
            --framework terraform \
            --output cli \
            --output sarif \
            --output-file-path . \
            --soft-fail \
            --skip-check CKV_AWS_144,CKV_AWS_145
          # CKV_AWS_144 : S3 cross-region replication (non requis en lab)
          # CKV_AWS_145 : S3 non-default KMS (on utilise notre propre KMS)
        # --soft-fail : ne bloque pas le pipeline sur les checks non-critiques
        # En production : retirer --soft-fail et corriger toutes les erreurs

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true
        # SARIF : résultats visibles dans GitHub → Security → Code scanning

# =============================================================
# Job 3 — Tests Python Lambda
# =============================================================
  python-tests:
    name: "Tests Python Lambda"
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pytest boto3 moto[iot,dynamodb,cloudwatch,s3] pytest-cov

      - name: Run Lambda unit tests
        run: |
          pytest src/lambda/tests/ \
            -v \
            --tb=short \
            --cov=src/lambda/analyze_vibration \
            --cov-report=term-missing \
            --cov-fail-under=70
        # --cov-fail-under=70 : couverture minimale 70% requise

      - name: Run Edge tests
        run: |
          pytest src/greengrass/tests/ -v --tb=short
        continue-on-error: true
        # continue-on-error : les tests edge sont optionnels (docker non dispo en CI)

# =============================================================
# Job 4 — Tests Spring Boot (supervision-api)
# =============================================================
  spring-boot-tests:
    name: "Tests Spring Boot — supervision-api"
    runs-on: ubuntu-latest
    needs: terraform-validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run unit tests
        working-directory: src/supervision-api
        run: mvn test --batch-mode
        # @WebMvcTest + @MockitoBean — aucun appel DynamoDB, aucune credential AWS requise

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-test-results-${{ github.run_id }}
          path: src/supervision-api/target/surefire-reports/
          retention-days: 7

# =============================================================
# Job 5 — Terraform Plan (PR uniquement)
# =============================================================
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: [terraform-validate, security-scan, python-tests, spring-boot-tests]
    if: github.event_name == 'pull_request'

    permissions:
      pull-requests: write  # pour poster le commentaire

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false  # nécessaire pour capturer l'output du plan

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Post Plan as PR Comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (tronqué — voir les logs CI pour le plan complet)'
              : plan;

            const body = `## Terraform Plan — \`${{ env.TF_WORKING_DIR }}\`

            <details><summary>Cliquer pour voir le plan complet</summary>

            \`\`\`terraform
            ${truncated}
            \`\`\`

            </details>

            *Workflow: \`${{ github.workflow }}\` | Run: \`${{ github.run_id }}\`*`;

            // Supprimer les anciens commentaires de plan pour éviter la pollution
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments.data) {
              if (comment.body.includes('Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });

      - name: Save Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7
        # Le binaire tfplan est sauvegardé — terraform apply utilisera ce fichier exact

      - name: Check Plan Status
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

# =============================================================
# Job 5 — Terraform Apply (push sur main uniquement)
# =============================================================
  terraform-apply:
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    needs: [terraform-validate, security-scan, python-tests, spring-boot-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment: production
    # GitHub Environment "production" : peut exiger une approbation manuelle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan (pré-apply)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Show Outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output
        continue-on-error: true

# =============================================================
# Job 6 — Drift Detection (schedule hebdomadaire)
# =============================================================
  drift-detection:
    name: "Drift Detection"
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan (drift check)
        working-directory: ${{ env.TF_WORKING_DIR }}
        id: drift
        run: |
          terraform plan -detailed-exitcode -no-color 2>&1 | tee drift_output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Alert on Drift
        if: steps.drift.outputs.exitcode == '2'
        run: |
          echo "::warning::DRIFT DÉTECTÉ — des ressources AWS ont été modifiées hors Terraform"
          cat drift_output.txt
          exit 1
        # exitcode 2 = changements détectés (drift)
        # exitcode 0 = aucun changement (no drift)
        # exitcode 1 = erreur Terraform
